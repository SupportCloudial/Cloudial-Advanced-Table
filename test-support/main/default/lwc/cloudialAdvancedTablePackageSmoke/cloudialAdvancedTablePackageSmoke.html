<template>
  <!-- Namespaced tag after managed package install -->
  <cloudialPackage-cloudial-advanced-table
    key-field={keyField}
    column-defs={columnDefs}
    data={rows}
    theme={theme}
    title={title}
    header-actions={headerActions}
    bulk-actions={bulkActions}
    selected-rows={selectedRows}
    enable-search
    enable-filter
    filter-defs={filterDefs}
    enable-column-picker
    enable-refresh
    chrome-action-placement="chrome"
    chrome-buttons-variant="icon"
    show-row-number-column
    onsave={handleSave}
    onrowselection={handleRowSelection}
    onrowaction={handleRowAction}
    onheaderaction={handleHeaderAction}
  >
    <div slot="toolbar" class="slds-text-body_small">Smoke toolbar slot</div>
  </cloudialPackage-cloudial-advanced-table>
</template>
